[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localtts"
version = "0.1.0"
description = "Local macOS PDF to speech utility."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
piper = [
    "piper-tts>=1.2.0",
]

[tool.setuptools]
py-modules = ["pdf_to_audio"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "output_audio", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
