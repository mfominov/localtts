[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localtts"
version = "0.1.0"
description = "Local macOS PDF to speech utility."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
piper = [
    "piper-tts>=1.2.0",
]
silero = [
    "silero>=0.4.1",
    "torch>=2.2.0",
    "scipy>=1.11.0",
]
f5tts = [
    "f5-tts>=1.1.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
]
audiobook = [
    "pymupdf>=1.24.0",
]

[tool.setuptools]
py-modules = ["pdf_to_audio"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "output_audio", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
