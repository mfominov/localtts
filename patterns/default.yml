# PDF text cleaning patterns for localtts.
# Override with PATTERNS_FILE=./my.yml or --patterns-file ./my.yml

line_drop:
  # Whole lines removed before normalization
  - pattern: '^\d{1,4}$'
  - pattern: '^(?:AI-Disrupt\s+)?PDLC\s*[·•]\s.{1,140}(?:\s+\d{1,4})?$'
    flags: [IGNORECASE]
  - pattern: '^(?:AI-DISRUPT\s+)?PSLC\s*[·•]\s.{1,140}(?:\s+\d{1,4})?$'
    flags: [IGNORECASE]
  - pattern: '^.{3,80}\s[|]\s.{1,80}(?:\s+\d{1,4})?$'
  - pattern: '^(?:AI-Disrupt\s+)?PDLC\s*[·•]'
    flags: [IGNORECASE]
  - pattern: '^(?:AI-DISRUPT\s+)?PSLC\s*[·•]'
    flags: [IGNORECASE]

inline_sub:
  # Applied after normalize_text (glued footers, orphan page numbers)
  - pattern: '\s*AI-Disrupt PDLC\s*[·•]\s*Целевое видение\s*(?:\d{1,4})?\s*'
    repl: ' '
    flags: [IGNORECASE]
  - pattern: '\s*AI-DISRUPT\s+PSLC\s*[·•]\s*Концепция\s*(?:\d{1,4})?\s*'
    repl: ' '
    flags: [IGNORECASE]
  - pattern: '\s[\w\-]{2,40}\s+PDLC\s*[·•]\s*[^\d.]{3,80}\s*(?:\d{1,4})?\s*'
    repl: ' '
    flags: [IGNORECASE]
  - pattern: '\s[\w\-]*DISRUPT\s+PSLC\s*[·•]\s*[^\d.]{3,80}\s*(?:\d{1,4})?\s*'
    repl: ' '
    flags: [IGNORECASE]
  - pattern: '\s[·•]\s[^\d.]{3,80}\s+\d{1,4}\s*$'
    repl: ''
  - pattern: '\s+\d{1,4}\s*$'
    repl: ''

# Spoken forms applied at extract (UI restores AI / ИИ for display).
ai_spoken_as: "эй ай"
ii_spoken_as: "и и"

# Pre-synth: numbers, dates, %, currency, № → Russian words (UI keeps digits).
normalize_numbers: true

# Silero-only: auto ё/stress flags (model defaults are already true) + optional +stress overrides.
# Example: замок: "зам+ок"  (+ before the stressed vowel).
silero:
  put_yo: true
  put_accent: true

homographs: {}

# Silero speech rhythm (pauses as silence samples; soft-limit for subchunks).
speech:
  silero_chunk_chars: 300
  pauses:
    period_ms: 400
    exclamation_ms: 400
    question_ms: 400
    comma_ms: 150
    semicolon_ms: 250
    colon_ms: 250
    # Spaced dash/тире (title - subtitle); not hyphen inside AI-Disrupt
    dash_ms: 400
  dialogue:
    quote_before_ms: 280
    quote_after_ms: 180

